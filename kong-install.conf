# kong-install.conf - sourced by kong-install.sh
# Values here can be overridden on the command line (-v, -p).

# Kong version (OSS, X.Y.Z)
KONG_PACKAGE_VERSION=3.9.4

# Name written into the kong.conf header
CONF_AUTHOR="Your Name"

TIMEZONE=Asia/Bangkok

# --- Data plane -----------------------------------------------------------
# Control plane hostname or IP (no scheme, no port). Required for -m dp.
HOST_CP=10.0.0.10

# Directory on the DP holding cluster.crt and cluster.key copied from the CP
CLUSTER_CERT_DIR=./

# --- Control plane / standalone database -----------------------------------
# Leave POSTGRES_HOST empty to install PostgreSQL locally.
# Set it to use an external Postgres; the admin user below creates the
# 'kong' role and database.
POSTGRES_HOST=
POSTGRES_PORT=5432
POSTGRES_ADMIN_USER=postgres
POSTGRES_PASSWORD=
POSTGRES_SSL=on

# --- Change freeze (cp / st only) ------------------------------------------
# Lock the Admin API and Kong Manager this many days after the first install.
# 0 = disabled. The date is set once; re-running the installer keeps it.
LOCK_AFTER_DAYS=60
# off   = Admin API fully switched off after the lock
# local = Admin API only on 127.0.0.1 (changes possible from the server via SSH)
LOCK_ADMIN_MODE=off
