name: postgres
services:
  postgres:
    image: percona/percona-distribution-postgresql:${PERCONA_POSTGRES_TAG:-18.4}
    container_name: postgres
    restart: unless-stopped

    cpus: "4.0"
    mem_limit: 8g

    env_file:
      - .env

    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_monitor
      - -c
      - pg_stat_monitor.pgsm_query_max_len=2048
      - -c
      - pg_stat_monitor.pgsm_normalized_query=1
      - -c
      - pg_stat_monitor.pgsm_enable_query_plan=off

    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - "${POSTGRES_DATA_DIR:-/data/postgresql}:/data/db:Z"
      # - "./initdb:/docker-entrypoint-initdb.d:ro,Z"

    networks:
      finema-internal:
        aliases:
          - postgres

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

    stop_grace_period: 1m

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  kong-internal:
    external: true
    name: kong-internal
